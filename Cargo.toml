[package]
name = "taskbar-bsk"
version = "0.1.0"
edition = "2021"
description = "Battery levels of wireless mice, keyboards, headsets and controllers on the Windows 11 taskbar"
license = "GPL-3.0-or-later"
repository = "https://github.com/bsk-iT/taskbar-bsk"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WinRT: Bluetooth LE, game controllers, toast notifications.
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Data_Xml_Dom",
    "Devices_Power",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Storage_Streams",
    "System_Power",
    "UI_Notifications",
    "Win32_System_Com",
] }
# Plain Win32: windows, GDI, registry, SetupAPI, HID, sockets, serial ports, clipboard.
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Icon, version info and manifest (see build.rs).
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind (not abort): a bug in one device driver is caught and that driver disabled, instead
# of killing the whole app. See scan.rs.
panic = "unwind"
